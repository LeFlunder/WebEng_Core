services:
  
  backend:
    container_name: nx-backend
    build:
      context: .                         
      dockerfile: Dockerfile.backend     
    ports:
      - "3000:3000"         
    environment:
      - NODE_ENV=production        
    restart: always            

  frontend:
    container_name: nx-frontend
    build:
      context: .                
      dockerfile: Dockerfile.frontend    
    ports:
      - "4200:4200"                      
    restart: always
    depends_on:
      - backend 
  
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata: